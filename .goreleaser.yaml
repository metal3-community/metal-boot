version: 2

project_name: metal-boot

env:
  - REPO={{.GitURL | trimprefix "https://github.com/" | trimsuffix ".git"}}

before:
  hooks:
    - go mod tidy

builds:
  - env: ["CGO_ENABLED=0"]
    main: ./cmd/metal-boot
    binary: metal-boot
    goos:
      - linux
    goarch:
      - amd64
      - arm64

upx:
  - enabled: true
    compress: best
    lzma: true

# Images are assembled from the apko-rendered Ironic rootfs plus the
# UPX-compressed binary goreleaser built above (see Dockerfile.goreleaser).
dockers:
  - dockerfile: Dockerfile.goreleaser
    use: buildx
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
    extra_files:
      - apko.yaml
      - configs/config.example.yaml
  - dockerfile: Dockerfile.goreleaser
    use: buildx
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
    extra_files:
      - apko.yaml
      - configs/config.example.yaml

docker_manifests:
  - name_template: "ghcr.io/{{.Env.REPO}}:{{.Version}}"
    image_templates:
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-amd64"
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-arm64"
  - name_template: "ghcr.io/{{.Env.REPO}}:latest"
    image_templates:
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-amd64"
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-arm64"
  - name_template: "ghcr.io/{{.Env.REPO}}:{{.ShortCommit}}"
    image_templates:
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-amd64"
      - "ghcr.io/{{.Env.REPO}}:{{.Version}}-arm64"

docker_signs:
  - cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
