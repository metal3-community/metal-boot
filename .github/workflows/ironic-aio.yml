name: Build and Publish Ironic All-in-One Image

on:
  push:
    branches:
      - main
    paths:
      - "apko.yaml"
      - "Dockerfile"
      - "cmd/metal-boot/**"
      - ".github/workflows/ironic-aio.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apko.yaml"
      - "Dockerfile"
      - "cmd/metal-boot/**"
      - ".github/workflows/ironic-aio.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the standalone apko base image (only on pushes to main).
      - name: Publish base image (apko)
        if: github.event_name != 'pull_request'
        id: apko
        uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          config: apko.yaml
          tag: ghcr.io/metal3-community/ironic-image:latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The Dockerfile builds the apko rootfs and cross-compiles metal-boot on
      # the build platform, so multi-arch needs no QEMU. On pull requests this
      # is build-only; on pushes to main it publishes latest + aio-latest.
      - name: Build and push metal-boot image
        id: image-ref
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GITREV=${{ github.sha }}
          tags: |
            ghcr.io/metal3-community/metal-boot:latest
            ghcr.io/metal3-community/metal-boot:aio-latest

      - name: Output summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Ironic All-in-One Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully built and published ironic all-in-one image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Base Image:** \`${{ steps.apko.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Digest:** \`${{ steps.image-ref.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`ghcr.io/metal3-community/metal-boot:latest\`, \`ghcr.io/metal3-community/metal-boot:aio-latest\`" >> $GITHUB_STEP_SUMMARY
